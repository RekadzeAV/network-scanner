services:
  network-scanner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: network-scanner:${VERSION:-dev}
    container_name: network-scanner-cli
    # Для сканирования сети (ICMP/raw сокеты) нужны дополнительные права
    cap_add:
      - NET_RAW
      - NET_ADMIN
    network_mode: host
    # Запуск от непривилегированного пользователя (см. Dockerfile USER scanner)
    user: "1000:1000"
    environment:
      - VERSION=${VERSION:-dev}
      - NETWORK_SCANNER_LOG_LEVEL=info
    # Пример: сканирование сети при запуске
    # command: scan --cidr 192.168.1.0/24 --ports 1-1000 --timeout 2
    # Чтобы использовать, закомментируйте command и раскомментируйте ниже:
    # command: ["--help"]

volumes: {}
networks: {}
