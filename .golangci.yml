run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosec
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    check-type-assertions: true
  gosec:
    excludes:
      # G304: чтение файлов по пути из переменной — используется в CLI/GUI-импорте
      # (hostlist importer, inventory DB, config). Пути приходят из аргументов
      # пользователя и валидируются на уровне вызывающего кода.
      - G304

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - govet
