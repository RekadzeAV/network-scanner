name: Go CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Install libpcap headers (cgo gopacket/pcap)
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install libpcap headers (cgo gopacket/pcap)
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p release-build/release/
        go build -ldflags="-s -w" -o release-build/release/network-scanner-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/network-scanner

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: network-scanner-${{ matrix.goos }}-${{ matrix.goarch }}
        path: release-build/release/

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install libpcap headers (cgo gopacket/pcap)
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.64.8
        args: --timeout=5m

  security:
    runs-on: ubuntu-latest
    name: Security scan (govulncheck)
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install libpcap headers (cgo gopacket/pcap)
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Download dependencies
      run: go mod download

    # govulncheck ставится из официального модуля golang.org/x/vuln и НЕ
    # добавляется в go.mod проекта: зависимостей приложения не растёт.
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        "$(go env GOPATH)/bin/govulncheck" ./...

  benchmarks:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install libpcap headers (cgo gopacket/pcap)
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Run benchmarks
      run: |
        mkdir -p release-build/benchmarks/
        go test -bench=. -benchmem -run=^$ -count=3 ./internal/scanner/ > release-build/benchmarks/scanner.txt 2>&1
        go test -bench=. -benchmem -run=^$ -count=3 ./internal/nettools/ > release-build/benchmarks/nettools.txt 2>&1
        go test -bench=. -benchmem -run=^$ -count=3 ./internal/topology/ > release-build/benchmarks/topology.txt 2>&1
        go test -bench=. -benchmem -run=^$ -count=3 ./internal/audit/ > release-build/benchmarks/audit.txt 2>&1
        go test -bench=. -benchmem -run=^$ -count=3 ./internal/gui/ > release-build/benchmarks/gui.txt 2>&1
        go test -bench=. -benchmem -run=^$ -count=3 ./internal/integration/ > release-build/benchmarks/integration.txt 2>&1

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: release-build/benchmarks/
        retention-days: 30

    - name: Print summary
      run: |
        echo "=== Benchmark Summary ==="
        for f in release-build/benchmarks/*.txt; do
          echo "--- $(basename $f) ---"
          grep -E "^Benchmark|^PASS|^ok" "$f" | head -20
          echo ""
        done

  d-track-smoke:
    runs-on: ubuntu-latest
    name: D-Track Smoke Tests
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Install libpcap headers (cgo gopacket/pcap)
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: D4 — Feature Flags Smoke
      run: |
        echo "Testing feature flags system..."
        go test -v -cover ./internal/features/... -run "DefaultFlags|StatusReport|Concurrency"

    - name: D1 — Topology Deduplication Smoke
      run: |
        echo "Testing topology deduplication..."
        go test -v -cover ./internal/topology/... -run "Dedup|Explain|Replace|SourceType"

    - name: D1 — Text Export Smoke
      run: |
        echo "Testing text export fallback..."
        go test -v -cover ./internal/topology/... -run "Text|SaveAsText"

    - name: D1 — Topology Validation Smoke
      run: |
        echo "Testing topology validation..."
        go test -v -cover ./internal/topology/... -run "Validate"

    - name: D-Track Summary
      run: |
        echo "=== D-Track Smoke Summary ==="
        echo "✅ Feature Flags (D4): OK"
        echo "✅ Topology Deduplication (D1): OK"
        echo "✅ Text Export Fallback (D1): OK"
        echo "✅ Topology Validation (D1): OK"
        echo ""
        echo "All D-Track smoke tests passed."
