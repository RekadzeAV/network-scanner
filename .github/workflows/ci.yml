name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.25"
  GO_MODULE: "network-scanner"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Install libpcap headers (cgo gopacket/pcap)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: go test -v -short -coverprofile=coverage.out -covermode=atomic ./internal/scanner/... ./internal/nettools/... ./internal/topology/... ./internal/audit/... ./internal/gui/... ./internal/integration/...

      - name: Report coverage (informational)
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: ${TOTAL}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Run Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: [test, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Install Linux dependencies (GUI cgo)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libpcap-dev libasound2-dev libcups2-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxtest-dev libxdamage-dev libxfixes-dev libgl1-mesa-dev libgtk-3-dev

      - name: Build CLI binary
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p release-build
          go build -o release-build/network-scanner-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows-latest' && '.exe' || '' }} \
            -ldflags="-s -w -X main.Version=2.3.0 -X main.GitCommit=$(git rev-parse --short HEAD)" \
            ./cmd/network-scanner

      - name: Build GUI binary
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p release-build
          go build -o release-build/network-scanner-gui-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows-latest' && '.exe' || '' }} \
            -ldflags="-s -w ${{ matrix.os == 'windows-latest' && '-H windowsgui' || '' }}" \
            ./cmd/gui

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-scanner-${{ matrix.os }}-${{ matrix.arch }}
          path: release-build/network-scanner-${{ matrix.os }}-${{ matrix.arch }}*

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-scanner-gui-${{ matrix.os }}-${{ matrix.arch }}
          path: release-build/network-scanner-gui-${{ matrix.os }}-${{ matrix.arch }}*
