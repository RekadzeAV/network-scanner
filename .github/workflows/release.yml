name: Release

# Релиз через GoReleaser (.goreleaser.yaml). Теги v* создаются только этим
# workflow (Ruleset «иммутабельность тегов» — см. docs/dev/RULESETS.md).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GoReleaser требует полную историю для changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install libpcap headers (cgo gopacket/pcap)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download dependencies
        run: go mod download

      # Перед релизом — быстрый smoke: тесты критических пакетов в -short.
      - name: Run tests
        run: go test -short -coverprofile=coverage.out ./internal/scanner/... ./internal/nettools/... ./internal/topology/... ./internal/audit/... ./internal/gui/... ./internal/integration/...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

